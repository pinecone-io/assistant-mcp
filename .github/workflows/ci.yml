name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default token (see maintenance issue #6).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: fmt / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      # Clippy runs for visibility but does not fail the build yet.
      # Tightening to `-D warnings` is tracked in maintenance issue #10
      # (fix clippy lints & small correctness), which unblocks a hard gate.
      - name: Clippy (non-blocking until #10)
        run: cargo clippy --all-targets || true
